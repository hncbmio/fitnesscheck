<!DOCTYPE html>

<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>115年華南Fitness We Can 判定工具</title>

    <style>

        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 10px; margin: 0; }

        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; box-sizing: border-box; }

        h2 { color: #c0392b; text-align: center; margin-bottom: 15px; font-size: 1.4rem; line-height: 1.4; }

        .disclaimer { background-color: #fff3cd; color: #856404; padding: 12px; border-radius: 8px; border: 1px solid #ffeeba; font-size: 14px; line-height: 1.6; margin-bottom: 20px; text-align: center; }

        .banner-img { width: 100%; border-radius: 8px; margin-bottom: 15px; height: 140px; object-fit: cover; background-color: #eee; }

        .entry-row { border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; position: relative; }

        .entry-row h4 { margin-top: 0; color: #555; border-bottom: 1px solid #eee; padding-bottom: 8px; font-size: 1.1rem; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .input-group { margin-bottom: 10px; }

        .full-width { grid-column: span 2; }

        label { display: block; margin-bottom: 4px; font-size: 14px; font-weight: bold; color: #444; }

        .label-hint { font-size: 12px; color: #e67e22; font-weight: normal; }

        input, select { width: 100%; padding: 12px 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }

        .dist-group { display: flex; gap: 5px; }

        .dist-group input { flex: 2; }

        .dist-group select { flex: 1; background-color: #f0f0f0; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

        .add-btn { background-color: #3498db; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }

        .check-btn { background-color: #27ae60; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }

        .export-btn { background-color: #2980b9; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; display: none; }

        .export-hint { display: none; color: #2c3e50; font-size: 14px; text-align: center; margin-top: 5px; line-height: 1.5; font-weight: bold; background: #ecf0f1; padding: 10px; border-radius: 6px; border-left: 5px solid #2980b9; }

        .remove-btn { position: absolute; top: 10px; right: 10px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-weight: bold; }

        #result-container { margin-top: 25px; border-top: 2px dashed #eee; padding-top: 15px; }

        .summary-box { background: #e8f4fd; border: 1px solid #3498db; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-around; font-size: 16px; font-weight: bold; }

        .summary-pass { color: #27ae60; }

        .summary-fail { color: #e74c3c; }

        .result-item { padding: 12px; border-radius: 6px; margin-bottom: 8px; font-size: 15px; border-left: 6px solid; line-height: 1.5; }

        .pass-item { background: #d4edda; color: #155724; border-left-color: #28a745; }

        .fail-item { background: #f8d7da; color: #721c24; border-left-color: #dc3545; }

        @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } .summary-box { flex-direction: column; gap: 8px; align-items: center; } }

    </style>

</head>

<body>

 

<div class="card">

    <h2>🏃 115年華南Fitness We Can<br>活動一 運動達標<br>運動紀錄初判工具</h2>

 

    <div class="disclaimer">

        ■■ <strong>重要聲明</strong>■■<br>

        此工具僅供參加同仁自行初步判定紀錄是否合規，<strong>非正式審核判定結果</strong>。<br>

        <strong>(本網頁不會留存您的紀錄內容)</strong>

    </div>

 

 

    <div id="entries"></div>

 

    <div class="btn-group">

        <button class="add-btn" onclick="addEntry()">＋ 新增一筆紀錄 (上限10筆)</button>

        <button class="check-btn" onclick="checkAll()">🚀 開始初步判定</button>

        <button id="export-btn" class="export-btn" onclick="exportToExcel()">📥 匯出 Excel 判定檔 (.csv)</button>

        <div id="export-hint" class="export-hint">

            💡 <strong>貼心提醒：</strong><br>可將匯出之檔案同運動紀錄截圖一併<br>E-mail 給 <strong>劉思佳護理師</strong>

        </div>

    </div>

 

    <div id="result-container"></div>

</div>

 

<script>

let entryCounter = 0;

let lastResults = [];

 

function addEntry() {

    const currentRows = document.querySelectorAll('.entry-row');

    if (currentRows.length >= 10) { alert("已達上限"); return; }

    entryCounter++;

    const container = document.getElementById('entries');

    const div = document.createElement('div');

    div.className = 'entry-row';

    div.id = `entry-${entryCounter}`;

    div.innerHTML = `

        <h4>紀錄 #${entryCounter}</h4>

        <button class="remove-btn" onclick="removeEntry(${entryCounter})">×</button>

        <div class="grid">

            <div class="input-group"><label>日期<span class="label-hint">(同一日僅採計一次)</span></label><input type="date" class="d-date" value="2026-01-26"></div>

            <div class="input-group"><label>運動項目<span class="label-hint">（需有明確圖示或文字)</span></label><input type="text" class="d-activity" placeholder="例：跑步"></div>

            <div class="input-group"><label>時間 (分鐘)</label><input type="number" class="d-duration" placeholder="須滿20"></div>

            <div class="input-group"><label>距離 <span class="label-hint">（至少1公里)</span></label>

                <div class="dist-group">

                    <input type="number" class="d-distance" step="0.01" placeholder="數值">

                    <select class="d-unit"><option value="km">公里</option><option value="mi">英里</option></select>

                </div>

            </div>

            <div class="input-group full-width"><label>平均心率 (次/分)<span class="label-hint">(與距離擇一)</span></label><input type="number" class="d-hr" placeholder="選填"></div>

        </div>`;

    container.appendChild(div);

}

 

function removeEntry(id) {

    if(document.querySelectorAll('.entry-row').length > 1) document.getElementById(`entry-${id}`).remove();

}

 

function checkAll() {

    const rows = document.querySelectorAll('.entry-row');

    const resultContainer = document.getElementById('result-container');

    const exportBtn = document.getElementById('export-btn');

    const exportHint = document.getElementById('export-hint');

 

    let passCount = 0, failCount = 0, tempHTML = '';

    lastResults = [];

   

    // 日期索引物件：儲存各日期對應到的序號

    const dateMap = {};

    rows.forEach((row, index) => {

        const date = row.querySelector('.d-date').value;

        if (date) {

            if (!dateMap[date]) dateMap[date] = [];

            dateMap[date].push(index + 1); // 存入第幾筆紀錄

        }

    });

 

    rows.forEach((row, index) => {

        const currentIdx = index + 1;

        const date = row.querySelector('.d-date').value;

        const activity = row.querySelector('.d-activity').value.trim() || "未填";

        const duration = parseFloat(row.querySelector('.d-duration').value);

        const distVal = parseFloat(row.querySelector('.d-distance').value);

        const unit = row.querySelector('.d-unit').value;

        const hr = parseFloat(row.querySelector('.d-hr').value);

 

        let errors = [];

       

        // 檢查日期重複，並找出重複的序號

        if (!date) {

            errors.push("未填日期");

        } else if (dateMap[date].length > 1) {

            const others = dateMap[date].filter(i => i !== currentIdx);

            errors.push(`日期與紀錄 #${others.join(', #')} 重複`);

        }

       

        if (activity === "未填") errors.push("未填項目");

        if (isNaN(duration) || duration < 20) errors.push("未滿20分");

 

        let kmEq = isNaN(distVal) ? 0 : (unit === 'mi' ? distVal * 1.60934 : distVal);

        const okDist = (kmEq >= 1);

        const okHr = (!isNaN(hr) && hr > 0);

        if (!okDist && !okHr) errors.push("距離與心率皆未達標");

 

        const status = (errors.length === 0) ? "符合" : "未達標";

        const note = (errors.length === 0) ? (okDist ? `${kmEq.toFixed(2)}km達標` : "心率達標") : errors.join('、');

 

        if (errors.length === 0) {

            passCount++;

            tempHTML += `<div class="result-item pass-item"><strong>■ 紀錄 ${currentIdx} [${activity}]</strong><br>判定：符合<br><small>${note}</small></div>`;

        } else {

            failCount++;

            tempHTML += `<div class="result-item fail-item"><strong>■ 紀錄 ${currentIdx} [${activity}]</strong><br>判定：未達標<br><small>原因：${note}</small></div>`;

        }

 

        lastResults.push({ "序號": currentIdx, "日期": date, "項目": activity, "時間": duration, "距離(km)": kmEq.toFixed(2), "心率": hr || "-", "判定": status, "原因/備註": note });

    });

 

    resultContainer.innerHTML = `<div class="summary-box"><span class="summary-pass">符合：${passCount}</span><span class="summary-fail">未達標：${failCount}</span></div>${tempHTML}`;

    exportBtn.style.display = 'block';

    exportHint.style.display = 'block';

    resultContainer.scrollIntoView({ behavior: 'smooth' });

}

 

function exportToExcel() {

    if (lastResults.length === 0) return;

    let csv = "\ufeff序號,日期,項目,時間(分),距離(km),心率,判定結果,備註\n";

    lastResults.forEach(r => { csv += `${r["序號"]},${r["日期"]},${r["項目"]},${r["時間"]},${r["距離(km)"]},${r["心率"]},${r["判定"]},${r["原因/備註"]}\n`; });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });

    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);

    link.download = `華南運動判定_${new Date().toISOString().slice(0,10)}.csv`;

    link.click();

}

 

addEntry();

</script>

</body>

</html>
